<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uppdatera BV5 Tentasimulator</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f4f1; color: #1f1c1a; }
  @media (prefers-color-scheme: dark) { body { background: #141312; color: #ece7e1; } }
  main { max-width: 460px; padding: 28px 22px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 6px 0; }
  .muted { opacity: .7; font-size: 15px; }
  .ok { color: #2e7d51; font-weight: 600; }
  .err { color: #b3261e; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Uppdaterar appen …</h1>
  <p id="status">Rensar gamla sparade filer. Dina tentor, svar och "Öva på dina fel" påverkas inte.</p>
  <p class="muted" id="detail"></p>
</main>
<script>
/*
 * Tvingar fram senaste versionen av appen:
 * 1. avregistrerar service workern, 2. tömmer appens cacheminnen (inte IndexedDB – all studiedata ligger kvar),
 * 3. hämtar om alla appfiler förbi webbläsarens HTTP-cache, 4. öppnar appen igen.
 */
(async () => {
  const status = document.getElementById("status");
  const detail = document.getElementById("detail");
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if ("caches" in self) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
    let files = ["./", "./index.html", "./sw.js"];
    try {
      const sw = await (await fetch("./sw.js", { cache: "reload" })).text();
      const block = sw.slice(sw.indexOf("const PRECACHE"), sw.indexOf("];", sw.indexOf("const PRECACHE")));
      files = files.concat((block.match(/"\.\/[^"]*"/g) || []).map((s) => s.slice(1, -1)));
    } catch (e) {}
    files = [...new Set(files)];
    let n = 0;
    for (const f of files) {
      try { await fetch(f, { cache: "reload" }); } catch (e) {}
      n += 1;
      detail.textContent = `Hämtar om filer: ${n} av ${files.length}`;
    }
    status.innerHTML = '<span class="ok">Klart!</span> Appen öppnas med den senaste versionen …';
    setTimeout(() => location.replace("./#/"), 900);
  } catch (err) {
    status.innerHTML = '<span class="err">Det gick inte att uppdatera automatiskt.</span>';
    detail.textContent = String(err && err.message || err);
  }
})();
</script>
</body>
</html>
